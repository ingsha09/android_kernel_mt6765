name: Manual Kernel Build (MT6765)

on:
  workflow_dispatch: # Manual execution only

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev \
            bison flex libelf-dev clang lld llvm ccache zip unzip curl git

      - name: Setup Clang / Cross-Compiler
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/clang

      - name: Integrate KernelSU & SUSFS Patches
        run: |
          # 1. Setup KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # 2. Setup SUSFS repository and apply kernel 4.19 patches
          git clone --depth=1 https://gitlab.com/simonpunk/SUSFS4KSU.git $HOME/susfs
          
          # Apply SUSFS patches (adjust patch file paths if using a specific patch variant)
          cp -r $HOME/susfs/kernel_patches/fs/* fs/
          cp -r $HOME/susfs/kernel_patches/include/linux/* include/linux/
          
          # 3. Append KernelSU and SUSFS configs to blossom_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU=y" >> arch/arm64/configs/blossom_defconfig

      - name: Build Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out blossom_defconfig
          make -j$(nproc --all) O=out

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          
          sed -i 's/device.name1=/device.name1=dandelion/g' AK3/anykernel.sh
          sed -i 's/device.name2=/device.name2=blossom/g' AK3/anykernel.sh
          
          cd AK3
          zip -r9 ../blossom-ksu-susfs-kernel.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blossom-ksu-susfs-kernel
          path: blossom-ksu-susfs-kernel.zip
