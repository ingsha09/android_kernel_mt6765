name: Manual Kernel Build (MT6765)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev \
            bison flex libelf-dev clang lld llvm ccache zip unzip curl git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3

      - name: Cache Toolchain & Compiler Cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ${{ github.workspace }}/toolchain
          key: ${{ runner.os }}-proton-clang-v2
          restore-keys: |
            ${{ runner.os }}-proton-clang-

      - name: Setup Compiler (Proton Clang)
        run: |
          if [ ! -d "${{ github.workspace }}/toolchain/bin" ]; then
            echo "Clang not found in cache. Cloning..."
            mkdir -p ${{ github.workspace }}/toolchain
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ${{ github.workspace }}/toolchain
          else
            echo "Clang restored from cache."
          fi

      - name: Safely Patch drvgen.mk Tabs
        run: |
          python3 -c '
          path = "scripts/drvgen/drvgen.mk"
          try:
              with open(path, "r") as f:
                  content = f.read()
              content = content.replace("rm -f $@.tmp\n", "rm -f $@.tmp\n\ttouch $@.tmp\n")
              with open(path, "w") as f:
                  f.write(content)
              print("Patched drvgen.mk with valid tabs")
          except Exception as e:
              print(f"Skipped patching: {e}")
          '

      - name: Integrate KernelSU & SUSFS Source Patches
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          if [ ! -d "susfs" ]; then
            git clone --depth=1 https://gitlab.com/simonpunk/SUSFS4KSU.git susfs
          fi
          
          cp -r susfs/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp -r susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true

      - name: Build Kernel
        run: |
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          ccache -M 5G
          ccache -z

          mkdir -p out

          make ARCH=arm64 O=out blossom_defconfig
          make -j$(nproc --all) ARCH=arm64 O=out

          ccache -s

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AK3/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AK3/
          fi
          
          cd AK3
          zip -r9 ../blossom-ksu-susfs-kernel.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blossom-ksu-susfs-kernel
          path: blossom-ksu-susfs-kernel.zip
