name: Manual Kernel Build (MT6765)

on:
  workflow_dispatch: # Manual execution only

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies & Python Fix
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev \
            bison flex libelf-dev clang lld llvm ccache zip unzip curl git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python2 python3 python-is-python3

          # Ensure 'python' symlink is available globally for MTK drvgen scripts
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: Setup Compiler (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/clang

      - name: Setup Compiler Cache (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Integrate KernelSU & SUSFS Patches
        run: |
          # Setup KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Setup SUSFS repository and apply patches
          git clone --depth=1 https://gitlab.com/simonpunk/SUSFS4KSU.git $HOME/susfs
          
          cp -r $HOME/susfs/kernel_patches/fs/* fs/
          cp -r $HOME/susfs/kernel_patches/include/linux/* include/linux/
          
          # Append KernelSU & SUSFS configuration flags
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU=y"
          } >> arch/arm64/configs/blossom_defconfig

      - name: Build Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          # Configure ccache parameters
          ccache -M 5G
          ccache -z

          # Pre-create output directory and blank config target to prevent mv error
          mkdir -p out
          touch out/dtboimg.cfg

          make O=out blossom_defconfig
          make -j$(nproc --all) O=out

          ccache -s

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          
          sed -i 's/device.name1=/device.name1=dandelion/g' AK3/anykernel.sh
          sed -i 's/device.name2=/device.name2=blossom/g' AK3/anykernel.sh
          
          cd AK3
          zip -r9 ../blossom-ksu-susfs-kernel.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blossom-ksu-susfs-kernel
          path: blossom-ksu-susfs-kernel.zip
