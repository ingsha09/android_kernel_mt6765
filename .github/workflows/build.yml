name: Manual Kernel Build (MT6765)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev \
            bison flex libelf-dev clang lld llvm ccache zip unzip curl git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3

      - name: Cache Toolchain & Compiler Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/clang
          key: ${{ runner.os }}-kernel-build-toolchain
          restore-keys: |
            ${{ runner.os }}-kernel-build-toolchain

      - name: Setup Compiler (Proton Clang)
        run: |
          if [ ! -d "$HOME/clang/bin" ]; then
            echo "Clang not found in cache. Cloning..."
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/clang
          else
            echo "Proton Clang loaded from cache!"
          fi

      - name: Patch MTK drvgen.mk dummy target
        run: |
          if [ -f "scripts/drvgen/drvgen.mk" ]; then
            sed -i 's/mv dtboimg.cfg.tmp dtboimg.cfg/touch dtboimg.cfg.tmp \&\& mv dtboimg.cfg.tmp dtboimg.cfg/g' scripts/drvgen/drvgen.mk
            sed -i 's/mv dtbimg.cfg.tmp dtbimg.cfg/touch dtbimg.cfg.tmp \&\& mv dtbimg.cfg.tmp dtbimg.cfg/g' scripts/drvgen/drvgen.mk
          fi

      - name: Integrate KernelSU & SUSFS Source Patches
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          if [ ! -d "$HOME/susfs" ]; then
            git clone --depth=1 https://gitlab.com/simonpunk/SUSFS4KSU.git $HOME/susfs
          fi
          
          cp -r $HOME/susfs/kernel_patches/fs/* fs/
          cp -r $HOME/susfs/kernel_patches/include/linux/* include/linux/

      - name: Build Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          ccache -M 5G
          ccache -z

          make ARCH=arm64 O=out blossom_defconfig
          make -j$(nproc --all) ARCH=arm64 O=out

          ccache -s

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          
          sed -i 's/device.name1=/device.name1=dandelion/g' AK3/anykernel.sh
          sed -i 's/device.name2=/device.name2=blossom/g' AK3/anykernel.sh
          
          cd AK3
          zip -r9 ../blossom-ksu-susfs-kernel.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blossom-ksu-susfs-kernel
          path: blossom-ksu-susfs-kernel.zip
